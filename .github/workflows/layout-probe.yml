name: Layout probe
on:
  push:
    paths:
      - 'tools/layout_probe.mjs'
      - 'aal-you-ready/play/index.html'
      - 'aal-you-ready/play/club-circuit-scene.js'
      - '.github/workflows/layout-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          (cd aal-you-ready/play && python3 -m http.server 8080 > /tmp/http.log 2>&1 &)
          sleep 2
          mkdir -p aal-you-ready/play/assets/previews
          PW_CHANNEL=chrome node tools/layout_probe.mjs http://localhost:8080 aal-you-ready/play/assets/previews/probe.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aal-you-ready/play/assets/previews/probe_*.png
          git commit -m "Layout probe screenshots" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort 2>/dev/null; sleep 3; continue; }
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 4))
          done
          echo "::warning::Screenshots konnten nicht gepusht werden (Tests selbst sind durchgelaufen)"
