name: Build club speaker GLB (Blender)

# Baut den Club-Lautsprecher AYR-212 per Blender-Python (headless) als GLB,
# prueft ihn, rendert Vorschaubilder, testet die Babylon.js-Seite im
# Headless-Browser und committet die Ergebnisse ins Repository.

on:
  push:
    paths:
      - 'tools/blender/**'
      - 'tools/glb_check.py'
      - 'tools/browser_smoke.mjs'
      - 'aal-you-ready/play/speaker-glb-test.html'
      - '.github/workflows/club-speaker-glb.yml'
  workflow_dispatch:
    inputs:
      samples:
        description: 'Cycles-Samples fuer Vorschaubilder'
        default: '64'

permissions:
  contents: write

concurrency:
  group: club-speaker-glb
  cancel-in-progress: false

defaults:
  run:
    shell: bash   # aktiviert pipefail

env:
  BLENDER_VERSION: '4.2.3'
  BLENDER_SERIES: '4.2'
  ASSET_DIR: aal-you-ready/play/assets
  GLB: aal-you-ready/play/assets/club_speaker_pa212.glb
  PREVIEW_DIR: aal-you-ready/play/assets/previews

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Install Blender ${{ env.BLENDER_VERSION }} (LTS)
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 \
            libxkbcommon0 libsm6 libice6 libegl1 > /dev/null
          if [ ! -x "$HOME/blender/blender" ]; then
            url="https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
            echo "Lade $url"
            curl -fL --retry 3 --retry-delay 5 -o /tmp/blender.tar.xz "$url"
            mkdir -p "$HOME/blender"
            tar -xf /tmp/blender.tar.xz -C "$HOME/blender" --strip-components=1
          fi
          "$HOME/blender/blender" --version | head -1

      - name: Build model with Blender (headless)
        timeout-minutes: 20
        run: |
          mkdir -p build "$PREVIEW_DIR"
          "$HOME/blender/blender" -b --factory-startup --python-exit-code 1 \
            -P tools/blender/club_speaker_pa212.py -- \
            --out "$GLB" \
            --tex-dir build/textures \
            --preview-dir "$PREVIEW_DIR" \
            --samples "${{ github.event.inputs.samples || '64' }}" \
            --report "$PREVIEW_DIR/ayr212_build_report.json" 2>&1 | tee build/blender.log
          test -s "$GLB"

      - name: Validate GLB (own checks, sets grille alpha to MASK)
        run: |
          python3 tools/glb_check.py "$GLB" \
            --mask-materials M_Grille --alpha-cutoff 0.45 \
            --front-material M_Grille \
            --expect-size 0.60 0.995 0.53 --size-tolerance 0.03 \
            --max-tris 40000 --max-primitives 16 --max-bytes 2000000 \
            --json-out "$PREVIEW_DIR/ayr212_glb_check.json" \
            --summary "$GITHUB_STEP_SUMMARY" | tee build/glb_check.log

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate GLB (Khronos glTF-Validator)
        run: |
          npm install --no-save --silent gltf-validator@2 playwright@1.49.1
          node -e '
            const fs = require("fs"); const v = require("gltf-validator");
            v.validateBytes(new Uint8Array(fs.readFileSync(process.argv[1]))).then(r => {
              const i = r.issues;
              console.log(`Khronos-Validator: ${i.numErrors} Fehler, ${i.numWarnings} Warnungen, ${i.numInfos} Infos`);
              for (const m of i.messages.slice(0, 40)) console.log(` [${m.severity}] ${m.code} ${m.pointer || ""} ${m.message}`);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                `\nKhronos glTF-Validator: **${i.numErrors} Fehler**, ${i.numWarnings} Warnungen\n`);
              process.exit(i.numErrors > 0 ? 1 : 0);
            }).catch(e => { console.error(e); process.exit(1); });
          ' "$GLB" | tee build/khronos.log
          npx --yes @gltf-transform/cli@4 inspect "$GLB" | tee build/inspect.log || true

      - name: Babylon.js test page in headless Chrome
        id: browser
        continue-on-error: true
        timeout-minutes: 5
        run: |
          (cd aal-you-ready/play && python3 -m http.server 8080 > /tmp/http.log 2>&1 &)
          sleep 2
          PW_CHANNEL=chrome node tools/browser_smoke.mjs \
            http://localhost:8080/speaker-glb-test.html \
            "$PREVIEW_DIR/ayr212_babylon_headless.png" 90000 | tee build/browser.log

      - name: Upload logs and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: club-speaker-build
          path: |
            build/
            ${{ env.PREVIEW_DIR }}/
            ${{ env.GLB }}

      - name: Commit model and previews
        timeout-minutes: 3
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$GLB" "$PREVIEW_DIR"
          if git diff --cached --quiet; then echo "Keine Aenderungen"; exit 0; fi
          git commit -m "Build club speaker AYR-212 GLB (Blender ${BLENDER_VERSION})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
