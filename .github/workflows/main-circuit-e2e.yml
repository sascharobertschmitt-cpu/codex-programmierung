name: Main game circuit e2e

# Spielt eine Rundkurs-Partie über die echte Supabase-API und prüft dabei das
# Hauptspiel (index.html) im Headless-Browser. Legt Screenshots ins Repo.

on:
  push:
    paths:
      - 'aal-you-ready/play/index.html'
      - 'aal-you-ready/play/club-circuit-scene.js'
      - 'tools/circuit_multiplayer_smoke.mjs'
      - 'tools/solo_smoke.mjs'
      - '.github/workflows/main-circuit-e2e.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-circuit-e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Play circuit game against Supabase, render main page
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          (cd aal-you-ready/play && python3 -m http.server 8080 > /tmp/http.log 2>&1 &)
          sleep 2
          mkdir -p aal-you-ready/play/assets/previews
          PW_CHANNEL=chrome node tools/circuit_multiplayer_smoke.mjs http://localhost:8080 \
            aal-you-ready/play/assets/previews/main_circuit | tee /tmp/e2e.log
      - name: Solo game against bots in headless Chrome
        run: |
          curl -s -o /dev/null http://localhost:8080/index.html || (cd aal-you-ready/play && python3 -m http.server 8080 > /tmp/http2.log 2>&1 &)
          sleep 2
          PW_CHANNEL=chrome node tools/solo_smoke.mjs http://localhost:8080 \
            aal-you-ready/play/assets/previews/main_circuit | tee /tmp/solo.log
      - name: Commit screenshots
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aal-you-ready/play/assets/previews/main_circuit_*.png || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Main circuit e2e screenshots"
          # Parallel laufende Workflows committen ebenfalls: bis zu 5 Versuche, Screenshot-Konflikte zugunsten des neuesten Standes
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort 2>/dev/null; sleep 3; continue; }
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 4))
          done
          echo "::warning::Screenshots konnten nicht gepusht werden (Tests selbst sind durchgelaufen)"
