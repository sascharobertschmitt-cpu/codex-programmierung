name: Club circuit smoke test

# Testet die Rundkurs-Regeln (Node) und die 3D-Testseite (Headless-Chrome,
# automatische Zuege) und legt einen Screenshot ins Repo.

on:
  push:
    paths:
      - 'aal-you-ready/play/club-circuit-*'
      - 'aal-you-ready/play/club-exterior.js'
      - 'aal-you-ready/play/club-scene-preview.html'
      - 'aal-you-ready/play/assets/*.glb'
      - 'tools/test_club_rules.js'
      - 'tools/browser_smoke.mjs'
      - '.github/workflows/club-circuit-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: club-circuit-smoke-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rule tests
        run: node tools/test_club_rules.js
      - name: 3D page in headless Chrome (autoplay)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          (cd aal-you-ready/play && python3 -m http.server 8080 > /tmp/http.log 2>&1 &)
          sleep 2
          mkdir -p aal-you-ready/play/assets/previews
          PW_CHANNEL=chrome node tools/browser_smoke.mjs \
            "http://localhost:8080/club-circuit-test.html?autoplay=14" \
            aal-you-ready/play/assets/previews/circuit_headless.png 240000 | tee /tmp/browser.log
          PW_CHANNEL=chrome node tools/browser_smoke.mjs \
            "http://localhost:8080/club-circuit-test.html?view=city" \
            aal-you-ready/play/assets/previews/circuit_city.png 240000 | tee -a /tmp/browser.log
          PW_CHANNEL=chrome node tools/browser_smoke.mjs \
            "http://localhost:8080/club-scene-preview.html?view=overview&rain=0" \
            aal-you-ready/play/assets/previews/scene_rig_overview.png 240000 | tee -a /tmp/browser.log || true
          PW_CHANNEL=chrome node tools/browser_smoke.mjs \
            "http://localhost:8080/club-scene-preview.html?view=follow&walk=1&rain=0" \
            aal-you-ready/play/assets/previews/scene_rig_follow.png 240000 | tee -a /tmp/browser.log || true
          PW_CHANNEL=chrome node tools/browser_smoke.mjs \
            "http://localhost:8080/club-scene-preview.html?view=follow&n=6&lineup=1&rain=0" \
            aal-you-ready/play/assets/previews/scene_figures.png 240000 | tee -a /tmp/browser.log || true
          PW_CHANNEL=chrome node tools/browser_smoke.mjs \
            "http://localhost:8080/club-scene-preview.html?view=floor&rain=0" \
            aal-you-ready/play/assets/previews/scene_floor.png 240000 | tee -a /tmp/browser.log || true
          PW_CHANNEL=chrome node tools/browser_smoke.mjs \
            "http://localhost:8080/club-scene-preview.html?card=aufgabe&title=Air-DJ&rain=0" \
            aal-you-ready/play/assets/previews/scene_cards.png 240000 | tee -a /tmp/browser.log || true
      - name: Commit screenshot
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aal-you-ready/play/assets/previews/circuit_headless.png aal-you-ready/play/assets/previews/circuit_city.png aal-you-ready/play/assets/previews/scene_*.png || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Circuit smoke test screenshot"
          # Parallel laufende Workflows committen ebenfalls: bis zu 5 Versuche, Screenshot-Konflikte zugunsten des neuesten Standes
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort 2>/dev/null; sleep 3; continue; }
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 4))
          done
          echo "::warning::Screenshots konnten nicht gepusht werden (Tests selbst sind durchgelaufen)"
