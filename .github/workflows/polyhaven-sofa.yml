name: Build Poly Haven sofa GLB
on:
  push:
    paths:
      - '.github/workflows/polyhaven-sofa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch glTF and all dependencies from Poly Haven
        timeout-minutes: 8
        run: |
          mkdir -p aal-you-ready/play/assets/sofa
          python3 - <<'PY'
          import urllib.request,json,pathlib,os
          base='https://api.polyhaven.com/files/sofa_02'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'AalYouReadyAssetBuild/1.0'})
              with urllib.request.urlopen(req,timeout=90) as r:return r.read()
          manifest=json.loads(get(base))
          variants=manifest['gltf']
          variant=variants.get('1k') or next(iter(variants.values()))
          file=variant['gltf']
          url=file['url']
          gltf=json.loads(get(url))
          out=pathlib.Path('aal-you-ready/play/assets/sofa')
          sourcebase=url.rsplit('/',1)[0]+'/'
          includes=file.get('include') or variant.get('include') or {}
          def remote(uri,kind):
              if uri.startswith('http'):return uri
              if kind=='buffer':return sourcebase+uri
              entry=includes.get(uri) or includes.get('./'+uri)
              if entry:return entry if isinstance(entry,str) else entry['url']
              for key,val in includes.items():
                  if key.endswith('/'+uri) or key==uri:
                      return val if isinstance(val,str) else val['url']
              return sourcebase+uri
          for kind in ('images','buffers'):
              for i,item in enumerate(gltf.get(kind,[])):
                  uri=item.get('uri')
                  if not uri or uri.startswith('data:'):continue
                  link=remote(uri,'buffer' if kind=='buffers' else 'image')
                  ext=pathlib.Path(uri.split('?')[0]).suffix or ('.bin' if kind=='buffers' else '.jpg')
                  name=f'{kind}_{i}{ext}'
                  print('Downloading',kind,i,link,flush=True)
                  (out/name).write_bytes(get(link))
                  item['uri']=name
          (out/'source.gltf').write_text(json.dumps(gltf))
          PY
      - name: Pack into a standalone GLB
        timeout-minutes: 8
        run: npx --yes @gltf-transform/cli copy aal-you-ready/play/assets/sofa/source.gltf aal-you-ready/play/assets/sofa_02.glb
      - name: Remove temporary source files
        run: rm -rf aal-you-ready/play/assets/sofa
      - name: Commit game-ready model
        timeout-minutes: 3
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -s aal-you-ready/play/assets/sofa_02.glb
          git add aal-you-ready/play/assets/sofa_02.glb
          git diff --cached --quiet || (git commit -m 'Add CC0 Poly Haven sofa GLB asset' && git push)
