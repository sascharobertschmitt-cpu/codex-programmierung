<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aal You Ready · Multiplayer</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#49205a,#0b0b13 55%);color:#f7edff;font:16px system-ui}main{max-width:560px;margin:auto;padding:22px 16px 60px}h1{font-size:36px;line-height:1;letter-spacing:-.07em;margin:10px 0}h2{margin:0 0 14px;font-size:24px}.sub{color:#c995e4;font-size:12px;font-weight:800;letter-spacing:.18em}.panel{background:#191523;border:1px solid #5d3b70;border-radius:22px;padding:22px;margin:18px 0;box-shadow:0 16px 36px #0006}input,button{font:inherit;padding:15px;border-radius:13px;width:100%;margin:7px 0}input{background:#0c0b14;color:#fff;border:1px solid #6b5878}button{border:0;background:linear-gradient(120deg,#e995ff,#986bff);color:#140c1d;font-weight:900}button:disabled{opacity:.45}.secondary{background:#35263f;color:#f5e3ff}.muted{color:#aaa0b5}.code{font-size:38px;letter-spacing:.14em;font-weight:900;text-align:center}#qr{background:#fff;border-radius:12px;width:220px;height:220px;display:block;margin:18px auto;padding:10px}.member{background:#292136;padding:12px;border-radius:12px;margin:7px 0}.hide{display:none}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.tile{aspect-ratio:1;display:grid;place-items:center;background:#3e2a51;border-radius:7px;font-size:11px;position:relative}.tile b{position:absolute;top:2px;left:4px;font-size:8px;opacity:.6}.tile.active{outline:2px solid #fff;background:#8543a4}.task{font-size:21px;line-height:1.5;background:#30243c;border-radius:16px;padding:20px}.tiny{font-size:12px;color:#b6a9c4}</style><main><div class="sub">🪩 THE DOMINIK EXPERIENCE</div><h1>AAL YOU READY?</h1><p class="muted">MULTIPLAYER ALPHA · Jeder auf seinem Handy · Papier & Stift bereithalten</p><section id="entry" class="panel"><h2>Gemeinsam spielen</h2><input id="name" placeholder="Dein Spielername" maxlength="25"><button onclick="create()">Neue Lobby erstellen</button><div style="text-align:center;color:#aa92bd;margin:10px">ODER</div><input id="joincode" placeholder="6-stelliger Lobbycode" maxlength="6"><button class="secondary" onclick="join()">Lobby beitreten</button></section><section id="lobby" class="panel hide"><div class="sub">DEINE LOBBY</div><div id="code" class="code"></div><canvas id="qr" width="220" height="220"></canvas><p class="tiny" style="text-align:center">Andere scannen den QR-Code und geben ihren Namen ein.</p><button class="secondary" onclick="share()">Einladungslink teilen</button><h2>Spieler</h2><div id="members"></div><button id="start" onclick="action('start')">Spiel starten</button><p id="waiting" class="muted"></p></section><section id="play" class="hide"><div class="panel"><div class="sub" id="turn"></div><div id="score"></div></div><div class="panel"><h2>Club Floor · 64 Felder</h2><div class="board" id="board"></div></div><div class="panel"><div id="task"></div><button id="roll" onclick="action('roll')">🎲 Würfeln</button><button id="next" onclick="action('next')">Aufgabe erledigt · Weiter</button></div></section><p id="error" style="color:#ff9da9"></p></main><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script>
const BASE='https://rlmuglsqeyeniutlmvbw.supabase.co/rest/v1/rpc/',KEY='sb_publishable_tmmQzdfFoJ2lOhjGrCMCmg_ggtKMnH5', $=id=>document.getElementById(id);let session=null,busy=false;
async function rpc(fn,data){const res=await fetch(BASE+fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify(data)});let v=await res.json();if(!res.ok)throw Error(v.message||'Verbindungsfehler');return v}
function error(e){$('error').textContent=e.message||String(e)}
function save(){localStorage.setItem('aal-multi-session',JSON.stringify(session))}
async function create(){try{const name=$('name').value.trim();session=await rpc('party_create',{p_name:name});save();await refresh()}catch(e){error(e)}}
async function join(){try{session=await rpc('party_join',{p_code:$('joincode').value.trim(),p_name:$('name').value.trim()});save();await refresh()}catch(e){error(e)}}
async function refresh(){if(!session||busy)return;try{const s=await rpc('party_snapshot',{p_code:session.code,p_token:session.token});render(s);$('error').textContent=''}catch(e){error(e)}}
async function action(a){if(busy)return;busy=true;try{await rpc('party_action',{p_code:session.code,p_token:session.token,p_host_token:session.host_token||null,p_action:a});await refreshForce()}catch(e){error(e)}finally{busy=false}}
async function refreshForce(){const s=await rpc('party_snapshot',{p_code:session.code,p_token:session.token});render(s)}
function share(){const url=location.origin+location.pathname+'?join='+session.code;if(navigator.share)navigator.share({title:'Aal You Ready?',url}).catch(()=>{});else navigator.clipboard.writeText(url).then(()=>alert('Link kopiert'))}
function render(s){$('entry').classList.add('hide');$('lobby').classList.toggle('hide',s.status!=='lobby');$('play').classList.toggle('hide',s.status==='lobby');if(s.status==='lobby'){$('code').textContent=s.code;let url=location.origin+location.pathname+'?join='+s.code;if(window.QRCode)QRCode.toCanvas($('qr'),url,{width:220,margin:1,color:{dark:'#1b0e29',light:'#ffffff'}},()=>{});$('members').innerHTML=s.players.map((p,i)=>'<div class="member">'+['🟣','🔵','🟡','🟢','🔴','⚪','🟠','🟤'][i]+' '+escapeHTML(p.name)+'</div>').join('');$('start').style.display=session.host_token?'block':'none';$('start').disabled=s.players.length<2;$('waiting').textContent=s.players.length+' / 8 Spieler · '+(session.host_token?'Du bist Host':'Warte, bis der Host startet');return}
let p=s.players[s.turn%s.players.length],mine=s.players.find(x=>x.id===s.players.find(y=>y.id===x.id)?.id);let myIndex=s.players.findIndex(x=>x.id===session.player_id);if(myIndex<0){myIndex=s.players.findIndex(x=>x.name===session.name)}$('turn').textContent='AM ZUG: '+p.name+' · '+(s.phase==='ready'?'WÜRFELN':'AUFGABE');$('score').innerHTML=s.players.map((x,i)=>'<span class="member" style="display:inline-block;margin-right:6px">'+['🟣','🔵','🟡','🟢','🔴','⚪','🟠','🟤'][i]+' '+escapeHTML(x.name)+' · '+x.points+' ⭐</span>').join('');$('board').innerHTML=Array.from({length:64},(_,i)=>{let players=s.players.map((p,j)=>p.position===i?['🟣','🔵','🟡','🟢','🔴','⚪','🟠','🟤'][j]:'').join('');return '<div class="tile '+(players?'active':'')+'"><b>'+i+'</b>'+(['🎭','🔤','🎫','🤯','✨'][i%5])+(players?'<span style="position:absolute;bottom:0;right:2px">'+players+'</span>':'')+'</div>'}).join('');$('task').innerHTML=s.phase==='task'?'<div class="task">'+escapeHTML(s.task||'')+'</div><p class="muted">Aufgaben auf Papier erledigen, wenn nötig.</p>':'<p class="muted">Das Handy zeigt, wer als Nächstes würfelt.</p>';$('roll').style.display=s.phase==='ready'?'block':'none';$('next').style.display=s.phase==='task'?'block':'none';$('roll').disabled=p.name!==session.name;$('next').disabled=p.name!==session.name}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const code=new URLSearchParams(location.search).get('join');if(code){$('joincode').value=code.toUpperCase();$('joincode').parentElement.querySelector('button.secondary').textContent='Lobby beitreten'}try{session=JSON.parse(localStorage.getItem('aal-multi-session')||'null');if(session)refresh()}catch{}setInterval(()=>{if(session)refresh()},2500);
</script></html>
