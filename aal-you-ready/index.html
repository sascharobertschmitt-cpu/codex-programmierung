<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10121c"><title>Aal You Ready? Alpha</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1019;color:#f3f3fb;font:16px system-ui,Arial}main{max-width:650px;margin:auto;padding:18px}h1{font-size:28px;color:#e0bbff}h2{font-size:21px}button,input,select{font:inherit;border-radius:12px;padding:13px;border:1px solid #555a75}button{background:#a96dff;color:#0d0920;font-weight:750;cursor:pointer}button:disabled{opacity:.4}input,select{background:#24283b;color:white;max-width:100%}.panel{background:#1b1f30;border:1px solid #33384e;padding:16px;border-radius:18px;margin:12px 0}.muted{color:#b2b7cd}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.sq{font-size:11px;aspect-ratio:1;border-radius:7px;background:#37374f;display:grid;place-items:center;text-align:center;padding:2px}.sq.act{background:#553777}.sq.slf{background:#12686a}.sq.risk{background:#7c3944}.sq.spec{background:#78612a}.sq.on{outline:3px solid white}.big{font-size:30px;font-weight:800}.chip{padding:7px;border-radius:8px;background:#323751}.hidden{display:none}label{display:block;margin:10px 0}small{color:#bdc2d5}hr{border:0;border-top:1px solid #3b4058;margin:18px 0}</style><main><h1>🪩 Aal You Ready?</h1><p class="muted">The Dominik Experience · Handy-Alpha · Ein Gerät</p><section id="setup" class="panel"><h2>Neue Partie</h2><label>Spieler (je eine Zeile)<textarea id="names" style="width:100%;height:120px;background:#24283b;color:white;padding:12px;border-radius:12px;font:inherit">Sascha\nLuna</textarea></label><label>Runden pro Spieler <select id="rounds"><option value="2">2 · Schnelltest</option><option value="4">4 · Kurz</option><option value="6">6 · Mittel</option></select></label><button onclick="start()">Spiel starten</button></section><section id="game" class="hidden"><div class="panel"><div id="status"></div><div id="score"></div></div><div class="panel"><div class="board" id="board"></div></div><div class="panel" id="action"></div><div class="row"><button onclick="pause()">⏸ Pause / Weiter</button><button onclick="reset()">↻ Neustart</button></div></section></main><script>
const $=id=>document.getElementById(id), types=['start',...Array.from({length:16},()=> 'act'),...Array.from({length:6},()=> 'slf'),...Array.from({length:5},()=> 'spec'),...Array.from({length:4},()=> 'risk')];let g=null,timer=null;
const tasks=[['Pantomime','Stelle eine Discokugel dar.'],['Pantomime','Stelle einen DJ mit kaputtem Mischpult dar.'],['Pantomime','Stelle jemanden dar, der seine Freunde im Club sucht.'],['Erklären','Erkläre „Afterhour“, ohne „Party“, „Morgen“ oder „Feiern“ zu sagen.'],['Erklären','Erkläre „Bass“, ohne „Musik“, „Laut“ oder „Box“ zu sagen.'],['Zeichnen','Zeichne einen Raver auf dem Weg nach Hause.'],['Zeichnen','Zeichne eine Nebelmaschine.'],['Impro','Verkaufe der Gruppe eine völlig nutzlose Club-Erfindung.'],['Pantomime','Stelle eine Person dar, die den letzten Bus verpasst.'],['Erklären','Erkläre „Stroboskop“, ohne „Licht“, „Blitzen“ oder „Club“ zu sagen.']];
const cats=['Stadt','Land','Tier','Dinge im Club','Dinge, die man auf einer Afterhour verliert','DJ oder Musiker','Ausrede fürs Zuspätkommen','Etwas, das Lärm macht','Gegenstand im Haushalt','Essen'];const letters='ABDEFGHIKLMNPRSTUVWZ'.split('');
function save(){localStorage.setItem('aal-alpha',JSON.stringify(g))}
function show(s){$('action').innerHTML=s}
function start(){let names=$('names').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,8);if(names.length<2)return alert('Mindestens zwei Spieler!');g={players:names.map(name=>({name,pos:0,pts:0,joker:1})),turn:0,max:+$('rounds').value,used:[],phase:'ready',paused:false};save();render()}
function reset(){if(confirm('Partie wirklich neu starten?')){localStorage.removeItem('aal-alpha');g=null;render()}}
function pause(){if(!g)return;g.paused=!g.paused;save();render()}
function player(){return g.players[g.turn%g.players.length]}
function render(){if(!g){$('setup').classList.remove('hidden');$('game').classList.add('hidden');return}$('setup').classList.add('hidden');$('game').classList.remove('hidden');let p=player();$('status').innerHTML='<b>Runde '+(Math.floor(g.turn/g.players.length)+1)+' / '+g.max+'</b> · '+p.name+' ist dran'+(g.paused?' · ⏸ PAUSE':'');$('score').innerHTML=g.players.map((x,i)=>'<span class="chip">'+(i===g.turn%g.players.length?'👉 ':'')+x.name+': '+x.pts+' ⭐</span>').join(' ');$('board').innerHTML=types.map((t,i)=>'<div class="sq '+t+(g.players.some(p=>p.pos===i)?' on':'')+'">'+i+'<br>'+({start:'🏁',act:'🎭',slf:'🔤',spec:'✨',risk:'⚡'}[t])+'</div>').join('');if(g.paused){show('<h2>⏸ Pausiert</h2><p>Tippe auf Pause / Weiter, um fortzufahren.</p>');return}if(g.phase==='ready')show('<h2>'+p.name+', du bist dran!</h2><p>Reicht das Handy weiter.</p><button onclick="roll()">🎲 Würfeln</button>');if(g.phase==='task')drawTask();if(g.phase==='slf')drawSLF();if(g.phase==='finish')show('<h2>🎉 Partie beendet</h2>'+[...g.players].sort((a,b)=>b.pts-a.pts).map((x,i)=>'<p>'+(i+1)+'. '+x.name+' – '+x.pts+' Punkte</p>').join('')+'<button onclick="reset()">Neue Partie</button>')}
function roll(){let n=1+Math.floor(Math.random()*6),p=player();p.pos=(p.pos+n)%32;g.roll=n;let t=types[p.pos];if(t==='start')t='spec';g.kind=t;g.phase=t==='slf'?'slf':'task';g.secret=false;g.active=false;g.seconds=60;g.selected=[];if(t==='act'){g.task=tasks[Math.floor(Math.random()*tasks.length)]}if(t==='slf'){g.letter=letters.filter(x=>!g.used.includes(x))[Math.floor(Math.random()*letters.filter(x=>!g.used.includes(x)).length)];if(!g.letter){g.used=[];g.letter=letters[Math.floor(Math.random()*letters.length)]}g.used.push(g.letter);g.categories=[...cats].sort(()=>Math.random()-.5).slice(0,3)}save();render()}
function drawTask(){let p=player(),t=g.kind,heading=t==='act'?g.task[0]:t==='risk'?'⚡ Risiko':'✨ Spezial';let desc=t==='act'?g.task[1]:t==='risk'?'Traust du dich? Stelle 30 Sekunden lang einen völlig überdrehten Clubbesucher dar.':'(Kon)Dominik sagt: Erfinde eine absurde Clubregel und präsentiere sie überzeugend!';show('<p class="muted">🎲 '+g.roll+' gewürfelt · Feld '+p.pos+'</p><h2>'+heading+'</h2>'+(t==='act'&&!g.secret?'<p>Geheimer Begriff – erst zeigen, wenn niemand auf den Bildschirm schaut.</p><button onclick="g.secret=true;save();render()">👁 Begriff aufdecken</button>': '<div class="panel">'+(t==='act'&&!g.active&&!g.secret?'':desc)+'</div>')+(t==='act'&&g.secret&&!g.active?'<button onclick="g.secret=false;save();render()">🙈 Begriff verdecken</button> ':'')+(!g.active?'<button onclick="begin()">▶ Aufgabe starten</button>':'<p class="big" id="clock">'+g.seconds+' s</p><button onclick="solved()">✅ Gelöst!</button>')+' <button onclick="done(0)">Nicht geschafft / Weiter</button>'+(p.joker>0&&!g.active?'<hr><button onclick="joker()">🃏 Zeitjoker (+15 Sekunden) · '+p.joker+' übrig</button>':''))}
function joker(){let p=player();if(p.joker<1)return;p.joker--;g.seconds+=15;save();render()}
function begin(){g.secret=false;g.active=true;save();render();let count=3;show('<h2>Start in <span id="count">3</span> …</h2>');let pre=setInterval(()=>{if(g.paused){clearInterval(pre);render();return}count--;if(count===0){clearInterval(pre);render();tick()}else if($('count'))$('count').textContent=count},1000)}
function tick(){clearInterval(timer);timer=setInterval(()=>{if(!g||g.paused||!g.active){clearInterval(timer);return}g.seconds--;if($('clock'))$('clock').textContent=g.seconds+' s';if(g.seconds<=0){clearInterval(timer);g.active=false;save();show('<h2>⏰ Zeit abgelaufen!</h2><button onclick="done(0)">Weiter</button>')}},1000)}
function solved(){clearInterval(timer);g.active=false;g.phase='award';save();let others=g.players.map((x,i)=>({x,i})).filter(o=>o.i!==g.turn%g.players.length);show('<h2>Wer hat richtig geraten?</h2><p>Mehrfachauswahl möglich.</p>'+others.map(o=>'<label><input type="checkbox" class="guess" value="'+o.i+'"> '+o.x.name+'</label>').join('')+'<button onclick="award()">Punkte vergeben</button>')}
function award(){let ids=[...document.querySelectorAll('.guess:checked')].map(x=>+x.value);if(ids.length){player().pts+=2;ids.forEach(i=>g.players[i].pts+=2)}done(0)}
function done(pts){clearInterval(timer);player().pts+=pts;g.turn++;g.phase=g.turn>=g.players.length*g.max?'finish':'ready';save();render()}
function drawSLF(){let p=player();if(!g.slfStarted){show('<p class="muted">🎲 '+g.roll+' gewürfelt · Feld '+p.pos+'</p><h2>🔤 Stadt, Land, Fluss</h2><p>Buchstabe: <strong class="big">'+g.letter+'</strong></p><p>Alle nennen oder notieren ihre Antworten. Ihr könnt das Handy herumreichen.</p><button onclick="g.slfStarted=true;g.seconds=60;save();render();tickSLF()">▶ 60 Sekunden starten</button>');return}show('<h2>🔤 Buchstabe '+g.letter+'</h2><p class="big" id="clock">'+g.seconds+' s</p>'+g.categories.map((c,i)=>'<label>'+c+'<input id="ans'+i+'" placeholder="Antwort mit '+g.letter+'"></label>').join('')+'<p><small>Einfacher Hotseat-Modus: Antworten gemeinsam besprechen und Punkte manuell vergeben.</small></p><button onclick="slfScore()">Antworten werten</button>')}
function tickSLF(){clearInterval(timer);timer=setInterval(()=>{if(!g||g.paused||g.phase!=='slf'){clearInterval(timer);return}g.seconds--;if($('clock'))$('clock').textContent=g.seconds+' s';if(g.seconds<=0){clearInterval(timer);g.seconds=0;if($('clock'))$('clock').textContent='Zeit!'}},1000)}
function slfScore(){clearInterval(timer);show('<h2>Antworten vergleichen</h2><p>Wählt die Punkte für '+player().name+'.</p><p>0 = keine gültige Antwort, 1 = doppelt, 2 = einzigartig, 3 = einzige gültige Antwort.</p>'+g.categories.map((c,i)=>'<label>'+c+' <select class="points"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>').join('')+'<button onclick="let n=[...document.querySelectorAll(\'.points\')].reduce((s,e)=>s+(+e.value),0);done(n)">Punkte übernehmen</button>')}
let old=localStorage.getItem('aal-alpha');try{if(old)g=JSON.parse(old)}catch{}if(g&&g.phase==='award')g.phase='task';render();
</script></html>
