<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10121c"><title>Aal You Ready? Alpha</title><style>*{box-sizing:border-box}html{background:#07080d}body{margin:0;min-height:100vh;color:#f5f2ff;font:15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:radial-gradient(ellipse 85% 28% at 50% -5%,#59266b75,transparent),radial-gradient(ellipse 90% 30% at 100% 50%,#37145350,transparent),#090a10}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;background:repeating-linear-gradient(0deg,transparent 0 3px,#ffffff08 4px 5px)}main{max-width:560px;margin:auto;padding:20px 15px 92px}h1{font-size:clamp(24px,7vw,34px);letter-spacing:-.07em;line-height:1.03;text-transform:uppercase;margin:0;color:white;font-weight:950;text-shadow:0 0 32px #ba54ff88}h2{font-size:23px;letter-spacing:-.04em;margin:4px 0 14px;font-weight:850}p{line-height:1.5}.muted,small{color:#9e9cb5}.muted{font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:700}.brand{display:flex;align-items:center;gap:15px;margin:8px 0 22px}.orb{width:66px;height:66px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:34px;background:radial-gradient(circle at 28% 24%,#fff 0%,#e6c6ff 13%,#a45bc8 35%,#41214d 72%,#160c22 100%);box-shadow:0 0 34px #a75bff65,inset -8px -10px 15px #13091a;transform:rotate(-15deg)}.eyebrow{color:#d98dff;font-size:10px;font-weight:900;letter-spacing:.25em;margin-bottom:7px;text-transform:uppercase}.panel{position:relative;overflow:hidden;background:linear-gradient(155deg,#1d1b2c 0%,#12131f 68%,#10121a 100%);border:1px solid #40334e;border-radius:22px;padding:19px;margin:12px 0;box-shadow:0 12px 35px #0005,inset 0 1px #ffffff0c}.panel:before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,#b873ff77,transparent)}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.row>*{flex:1}button,input,select,textarea{font:inherit;border-radius:13px;padding:14px;border:1px solid #554864}button{background:linear-gradient(135deg,#d97bff,#a36dff);color:#130b1b;font-weight:900;cursor:pointer;min-height:49px;box-shadow:0 5px 20px #9d51dd26;letter-spacing:-.01em}button:active{transform:scale(.985)}button:disabled{opacity:.4}input,select,textarea{background:#11131e!important;color:#fff!important;max-width:100%;outline:none}textarea{resize:vertical}label{display:block;margin:12px 0;font-size:13px;color:#d1cde0}label input, label select{margin-top:8px}#action>button{display:block;width:100%;margin:9px 0}#action>.panel{background:linear-gradient(135deg,#272037,#1a1928);border-color:#58446c;font-size:19px;line-height:1.5;padding:22px;margin:20px 0}#action>.panel:first-letter{color:#f4d5ff}.big{font-size:36px;font-weight:950;letter-spacing:-.05em;color:#e9c2ff}.chip{display:inline-flex;align-items:center;padding:8px 10px;border-radius:11px;background:#292336;border:1px solid #463553;margin:3px 4px 3px 0;font-size:12px;font-weight:750}.board{display:grid;grid-template-columns:repeat(17,minmax(0,1fr));grid-template-rows:repeat(17,1fr);gap:4px;aspect-ratio:1}.sq{position:relative;font-size:9px;border-radius:8px;background:#332442;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid #62406f55;min-width:0;min-height:0;line-height:1}.sq .symbol{font-size:clamp(8px,2vw,14px)}.sq .num{opacity:.65;font-size:7px}.sq.act{background:linear-gradient(145deg,#573069,#2b203e)}.sq.slf{background:linear-gradient(145deg,#165a60,#153138)}.sq.risk{background:linear-gradient(145deg,#833048,#401f33)}.sq.event{background:linear-gradient(145deg,#245e7e,#16344a)}.sq.dom{background:linear-gradient(145deg,#a04482,#4a214a)}.sq.spec{background:linear-gradient(145deg,#71522e,#382a27)}.sq.start{background:linear-gradient(145deg,#5b5c6e,#292937)}.sq.on{border:2px solid #fff;box-shadow:0 0 12px #d58affaa, inset 0 0 12px #e1c2ff33;z-index:2}.sq .tokens{font-size:8px;letter-spacing:-3px}.board-core{grid-column:2/17;grid-row:2/17;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 36%,#592b6688,transparent 58%),linear-gradient(145deg,#15101f,#090b13);border:1px solid #493353;border-radius:16px;box-shadow:inset 0 0 35px #06040c}.board-core .orb{width:78px;height:78px;margin-bottom:12px}.board-core b{font-size:20px;letter-spacing:-.05em}.board-core small{font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin-top:7px}.board-key{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;font-size:10px;color:#aaa0b7;margin-top:12px}.board-key span{white-space:nowrap}.game-meta{display:flex;justify-content:space-between;gap:10px;align-items:center}.roundtag{border:1px solid #76518a;border-radius:999px;padding:6px 10px;color:#e4b4fa;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}#status{font-size:17px;font-weight:850;margin-bottom:12px}#score{border-top:1px solid #ffffff15;padding-top:10px}#action{min-height:220px}#action>p.muted{font-size:11px}#action>button:not(:first-of-type){background:#2a2238;color:#f3dfff;border:1px solid #634778;box-shadow:none}#action>button:first-of-type{background:linear-gradient(110deg,#e88dff,#a17bff)}#action>button:last-child{margin-top:15px}#game>.row button{background:#1b1b2a;border:1px solid #443b54;color:#bdb4ca;font-size:12px;min-height:44px;box-shadow:none}.hidden{display:none!important}hr{border:0;border-top:1px solid #44334e;margin:18px 0}#action input[type=checkbox]{width:20px;height:20px;accent-color:#bc72fa;vertical-align:middle;margin-right:10px}.stage{color:#e3a7ff;font-weight:900;text-transform:uppercase;letter-spacing:.17em;font-size:11px;margin:0 0 10px}.footer{font-size:10px;text-align:center;color:#6d647a;letter-spacing:.12em;text-transform:uppercase;margin-top:25px}@media(max-width:390px){main{padding:14px 10px 80px}.panel{padding:13px;border-radius:18px}.board{gap:2px}.sq{border-radius:6px}.board-core .orb{width:64px;height:64px}.board-core b{font-size:17px}}</style><main><header class="brand"><div class="orb">🪩</div><div><div class="eyebrow">THE DOMINIK EXPERIENCE</div><h1>AAL YOU<br>READY<span style="color:#c783ff">?</span></h1><div class="muted" style="margin-top:8px">CLUB EDITION · ALPHA 0.3</div></div></header><section id="setup" class="panel"><h2>Neue Partie</h2><label>Spieler (je eine Zeile)<textarea id="names" style="width:100%;height:120px;background:#24283b;color:white;padding:12px;border-radius:12px;font:inherit">Sascha&#10;Luna</textarea></label><label>Runden pro Spieler <select id="rounds"><option value="2">2 · Schnelltest</option><option value="4">4 · Kurz</option><option value="6">6 · Mittel</option></select></label><button onclick="start()">Spiel starten</button></section><section id="game" class="hidden"><div class="panel"><div id="status"></div><div id="score"></div></div><div class="panel"><div class="stage">THE CLUB FLOOR · 64 FELDER</div><div class="board" id="board"></div><div class="board-key"><span>🎭 Activity</span><span>🔤 Stadt Land Fluss</span><span>🎫 Ereignis</span><span>🤯 Dominik</span><span>✨ Special</span><span>⚡ Chaos</span></div></div><div class="panel" id="action"></div><div class="row"><button onclick="pause()">⏸ Pause / Weiter</button><button onclick="reset()">↻ Neustart</button></div></section><div class="footer">NO SLEEP · JUST ONE MORE ROUND</div></main><script>
const $=id=>document.getElementById(id), types=(()=>{const counts={act:30,slf:12,event:8,dom:7,spec:6,risk:0};const out=['start'];const order=['act','slf','act','event','act','dom','slf','spec','act','act','slf','dom','event','spec','act'];while(out.length<64){let t=order[(out.length-1)%order.length];if(counts[t]>0){out.push(t);counts[t]--}else{let next=Object.keys(counts).find(k=>counts[k]>0);if(next){out.push(next);counts[next]--}}}return out})();let g=null,timer=null;
const tasks=[['Pantomime','Stelle eine Discokugel dar.'],['Pantomime','Stelle einen DJ mit kaputtem Mischpult dar.'],['Pantomime','Stelle jemanden dar, der seine Freunde im Club sucht.'],['Erklären','Erkläre „Afterhour“, ohne „Party“, „Morgen“ oder „Feiern“ zu sagen.'],['Erklären','Erkläre „Bass“, ohne „Musik“, „Laut“ oder „Box“ zu sagen.'],['Zeichnen','Zeichne einen Raver auf dem Weg nach Hause.'],['Zeichnen','Zeichne eine Nebelmaschine.'],['Pantomime','Stelle eine Person dar, die den letzten Bus verpasst.'],['Erklären','Erkläre „Stroboskop“, ohne „Licht“, „Blitzen“ oder „Club“ zu sagen.']];
const cats=['Stadt','Land','Tier','Dinge im Club','Dinge, die man auf einer Afterhour verliert','DJ oder Musiker','Ausrede fürs Zuspätkommen','Etwas, das Lärm macht','Gegenstand im Haushalt','Essen'];const letters='ABDEFGHIKLMNPRSTUVWZ'.split('');
function save(){localStorage.setItem('aal-alpha',JSON.stringify(g))}
function show(s){$('action').innerHTML=s}
function start(){let names=$('names').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,8);if(names.length<2)return alert('Mindestens zwei Spieler!');g={players:names.map(name=>({name,pos:0,pts:0,joker:1})),turn:0,max:+$('rounds').value,used:[],phase:'ready',paused:false};save();render()}
function reset(){if(confirm('Partie wirklich neu starten?')){localStorage.removeItem('aal-alpha');g=null;render()}}
function pause(){if(!g)return;g.paused=!g.paused;save();render()}
function player(){return g.players[g.turn%g.players.length]}
function render(){if(!g){$('setup').classList.remove('hidden');$('game').classList.add('hidden');return}$('setup').classList.add('hidden');$('game').classList.remove('hidden');let p=player();$('status').innerHTML='<div class="game-meta"><span>🎧 '+p.name+' ist dran</span><span class="roundtag">Runde '+Math.min(g.max,Math.floor(g.turn/g.players.length)+1)+' / '+g.max+'</span></div>'+(g.paused?' ⏸ PAUSE':'');$('score').innerHTML=g.players.map((x,i)=>'<span class="chip">'+(i===g.turn%g.players.length?'👉 ':'')+x.name+': '+x.pts+' ⭐</span>').join(' ');$('board').innerHTML=(()=>{let cells=types.map((t,i)=>{let x=i<17?i:i<33?16:i<49?16-(i-32):0,y=i<17?0:i<33?i-16:i<49?16:16-(i-48);let tokens=g.players.map((p,j)=>p.pos===i?['🟣','🔵','🟡','🟢','🔴','⚪','🟠','🟤'][j]:'').join('');return '<div class="sq '+t+(tokens?' on':'')+'" style="grid-column:'+(x+1)+';grid-row:'+(y+1)+'"><span class="num">'+i+'</span><span class="symbol">'+({start:'🏁',act:'🎭',slf:'🔤',spec:'✨',risk:'⚡',event:'🎫',dom:'🤯'}[t])+'</span>'+(tokens?'<span class="tokens">'+tokens+'</span>':'')+'</div>'}).join('');return cells+'<div class="board-core"><div class="orb">🪩</div><b>AAL YOU READY?</b><small>THE DOMINIK EXPERIENCE</small></div>'})();if(g.paused){show('<h2>⏸ Pausiert</h2><p>Tippe auf Pause / Weiter, um fortzufahren.</p>');return}if(g.phase==='ready')show('<h2>'+p.name+', du bist dran!</h2><p>Reicht das Handy weiter.</p><button onclick="roll()">🎲 Würfeln</button>');if(g.phase==='task')drawTask();if(g.phase==='slf')drawSLF();if(g.phase==='award')show('<h2>Auswertung</h2><button onclick="g.phase=\'task\';save();render()">Zur Aufgabe</button>');if(g.phase==='finish')show('<h2>🎉 Partie beendet</h2>'+[...g.players].sort((a,b)=>b.pts-a.pts).map((x,i)=>'<p>'+(i+1)+'. '+x.name+' – '+x.pts+' Punkte</p>').join('')+'<button onclick="reset()">Neue Partie</button>')}
function roll(){let n=1+Math.floor(Math.random()*6),p=player();p.pos=(p.pos+n)%64;g.roll=n;let t=types[p.pos];if(t==='start')t='event';g.kind=t;g.phase=t==='slf'?'slf':'task';g.secret=false;g.active=false;g.seconds=60;g.selected=[];if(t==='act'){g.task=tasks[Math.floor(Math.random()*tasks.length)]}g.slfStarted=false;if(t==='slf'){g.letter=letters.filter(x=>!g.used.includes(x))[Math.floor(Math.random()*letters.filter(x=>!g.used.includes(x)).length)];if(!g.letter){g.used=[];g.letter=letters[Math.floor(Math.random()*letters.length)]}g.used.push(g.letter);g.categories=[...cats].sort(()=>Math.random()-.5).slice(0,3)}save();render()}
function drawTask(){let p=player(),t=g.kind,heading=t==='act'?g.task[0]:t==='dom'?'🤯 (Kon)Dominik':t==='event'?'🎫 Club-Ereignis':t==='risk'?'⚡ Risiko':'✨ Spezial';let desc=t==='act'?g.task[1]:t==='dom'?['Wie net bezahlt?! Dominik kassiert 1 Punkt Eintritt.','Dominik schwätzt dich links! Beim nächsten Erklären darfst du 10 Sekunden lang nicht gestikulieren.','Da kotzt er! Dominik schenkt dir als Entschuldigung 2 Punkte.','Dominik hat das Licht ausgemacht. Stelle einen DJ ohne Strom pantomimisch dar.','Dominik hat den Clubschlüssel verloren. Alle suchen 10 Sekunden pantomimisch mit.'][Math.floor(Math.random()*5)]:t==='event'?['Der Bass droppt! Du bekommst 2 Punkte.','Happy Hour ohne Alkohol: Alle bekommen einen Punkt.','DJ-Wechsel! Du erhältst einen zusätzlichen Joker.','Stromausfall! Zeige 15 Sekunden pantomimisch, wie du den Club rettest.'][Math.floor(Math.random()*4)]:t==='risk'?'Traust du dich? Stelle 30 Sekunden lang einen völlig überdrehten Clubbesucher dar.':'✨ Spezialrunde: Erkläre den Begriff „Nebelmaschine“ ohne „Nebel“, „Maschine“ oder „Club“. ';show('<p class="muted">🎲 '+g.roll+' gewürfelt · Feld '+p.pos+'</p><h2>'+heading+'</h2>'+(t==='act'&&!g.secret?'<p>Geheimer Begriff – erst zeigen, wenn niemand auf den Bildschirm schaut.</p><button onclick="g.secret=true;save();render()">👁 Begriff aufdecken</button>': '<div class="panel">'+(t==='act'&&!g.active&&!g.secret?'':desc)+'</div>')+(t==='act'&&g.secret&&!g.active?'<button onclick="g.secret=false;save();render()">🙈 Begriff verdecken</button> ':'')+(!g.active?'<button onclick="begin()">▶ Aufgabe starten</button>':'<p class="big" id="clock">'+g.seconds+' s</p><button onclick="solved()">✅ Gelöst!</button>')+' <button onclick="done(0)">Nicht geschafft / Weiter</button>'+(p.joker>0&&!g.active?'<hr><button onclick="joker()">🃏 Zeitjoker (+15 Sekunden) · '+p.joker+' übrig</button>':''))}
function joker(){let p=player();if(p.joker<1)return;p.joker--;g.seconds+=15;save();render()}
function begin(){g.secret=false;g.active=true;save();render();let count=3;show('<h2>Start in <span id="count">3</span> …</h2>');let pre=setInterval(()=>{if(g.paused){clearInterval(pre);render();return}count--;if(count===0){clearInterval(pre);render();tick()}else if($('count'))$('count').textContent=count},1000)}
function tick(){clearInterval(timer);timer=setInterval(()=>{if(!g||g.paused||!g.active){clearInterval(timer);return}g.seconds--;if($('clock'))$('clock').textContent=g.seconds+' s';if(g.seconds<=0){clearInterval(timer);g.active=false;save();show('<h2>⏰ Zeit abgelaufen!</h2><button onclick="done(0)">Weiter</button>')}},1000)}
function solved(){clearInterval(timer);g.active=false;g.phase='award';save();let others=g.players.map((x,i)=>({x,i})).filter(o=>o.i!==g.turn%g.players.length);show('<h2>Wer hat richtig geraten?</h2><p>Mehrfachauswahl möglich.</p>'+others.map(o=>'<label><input type="checkbox" class="guess" value="'+o.i+'"> '+o.x.name+'</label>').join('')+'<button onclick="award()">Punkte vergeben</button>')}
function award(){let ids=[...document.querySelectorAll('.guess:checked')].map(x=>+x.value);if(ids.length){player().pts+=2;ids.forEach(i=>g.players[i].pts+=2)}done(0)}
function done(pts){clearInterval(timer);player().pts+=pts;g.turn++;g.phase=g.turn>=g.players.length*g.max?'finish':'ready';save();render()}
function drawSLF(){let p=player();if(!g.slfStarted){show('<p class="muted">🎲 '+g.roll+' gewürfelt · Feld '+p.pos+'</p><h2>🔤 Stadt, Land, Fluss</h2><p>Buchstabe: <strong class="big">'+g.letter+'</strong></p><p>Alle nennen oder notieren ihre Antworten. Ihr könnt das Handy herumreichen.</p><button onclick="g.slfStarted=true;g.seconds=60;save();render();tickSLF()">▶ 60 Sekunden starten</button>');return}show('<h2>🔤 Buchstabe '+g.letter+'</h2><p class="big" id="clock">'+g.seconds+' s</p>'+g.categories.map((c,i)=>'<label>'+c+'<input id="ans'+i+'" placeholder="Antwort mit '+g.letter+'"></label>').join('')+'<p><small>Einfacher Hotseat-Modus: Antworten gemeinsam besprechen und Punkte manuell vergeben.</small></p><button onclick="slfScore()">Antworten werten</button>')}
function tickSLF(){clearInterval(timer);timer=setInterval(()=>{if(!g||g.paused||g.phase!=='slf'){clearInterval(timer);return}g.seconds--;if($('clock'))$('clock').textContent=g.seconds+' s';if(g.seconds<=0){clearInterval(timer);g.seconds=0;if($('clock'))$('clock').textContent='Zeit!'}},1000)}
function slfScore(){clearInterval(timer);show('<h2>Antworten vergleichen</h2><p>Wählt die Punkte für '+player().name+'.</p><p>0 = keine gültige Antwort, 1 = doppelt, 2 = einzigartig, 3 = einzige gültige Antwort.</p>'+g.categories.map((c,i)=>'<label>'+c+' <select class="points"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>').join('')+'<button onclick="let n=[...document.querySelectorAll(\'.points\')].reduce((s,e)=>s+(+e.value),0);done(n)">Punkte übernehmen</button>')}
let old=localStorage.getItem('aal-alpha');try{if(old)g=JSON.parse(old)}catch{}if(g&&g.phase==='award')g.phase='task';render();
</script></html>
