<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aal You Ready? – 3D-Arena-Labor</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b13;color:#f5f5ff;font-family:system-ui,Arial,sans-serif}#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;outline:0}header{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;padding:12px 16px;pointer-events:none;text-shadow:0 2px 8px #000}h1{font-size:16px;margin:0;letter-spacing:.07em}small{color:#8ff6f6}#tools{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:12px;right:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{border:1px solid #56c9d1;border-radius:20px;background:#121b2d;color:white;padding:11px 14px;font-weight:700}#status{position:absolute;top:67px;left:14px;right:14px;color:#d4f5ff;font-size:12px;pointer-events:none}#error{position:absolute;top:30%;left:8%;right:8%;padding:15px;background:#4b1026;border-radius:10px;display:none;white-space:pre-wrap}
</style></head><body><canvas id="stage"></canvas><header><h1>AAL YOU READY? <small>ARENA LAB 0.3</small></h1><small>Eigenständiger 3D-Prototyp · ohne Multiplayer</small></header><div id="status">Initialisiere 3D …</div><div id="error"></div><div id="tools"><button id="overview">Übersicht</button><button id="angle">Perspektive</button><button id="walk">Weg prüfen</button><button id="stop">Stopp</button></div><script src="https://cdn.babylonjs.com/babylon.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),status=$('status'),error=$('error');
const PATH=(()=>{const p=[[0,0]];for(let x=1;x<8;x++)p.push([x,0]);for(let y=1;y<8;y++){if(y%2){for(let x=7;x>=1;x--)p.push([x,y])}else{for(let x=1;x<8;x++)p.push([x,y])}}for(let y=7;y>=1;y--)p.push([0,y]);return p})();
const key=(p)=>p.join(',');
const check=(()=>{const unique=new Set(PATH.map(key)).size===64,range=PATH.every(([x,y])=>x>=0&&x<8&&y>=0&&y<8),adj=PATH.every((p,i)=>{const q=PATH[(i+1)%64];return Math.abs(p[0]-q[0])+Math.abs(p[1]-q[1])===1});return {unique,range,adj,passed:unique&&range&&adj}})();
window.ARENA_DIAGNOSTICS={path:PATH,checks:check,version:'0.3'};
if(!check.passed)throw Error('Ungültiger 64-Felder-Rundkurs: '+JSON.stringify(check));
function boot(){
if(!window.BABYLON){error.style.display='block';error.textContent='Babylon.js konnte nicht geladen werden. Bitte Netzwerkverbindung prüfen.';return}
try{
const B=BABYLON,engine=new B.Engine($('stage'),true,{stencil:false,antialias:true}),scene=new B.Scene(engine);
scene.clearColor=new B.Color4(.018,.023,.042,1);
scene.imageProcessingConfiguration.toneMappingEnabled=false;
const camera=new B.ArcRotateCamera('arenaCamera',-Math.PI/2,0.91,20,new B.Vector3(0,0,0),scene);
camera.lowerRadiusLimit=10;camera.upperRadiusLimit=27;camera.lowerBetaLimit=.25;camera.upperBetaLimit=1.18;camera.wheelPrecision=45;camera.panningSensibility=0;camera.attachControl($('stage'),true);
const hemi=new B.HemisphericLight('warehouseFill',new B.Vector3(0,1,0),scene);hemi.intensity=1.5;hemi.groundColor=new B.Color3(.28,.31,.42);
const keylight=new B.DirectionalLight('overhead',new B.Vector3(-.6,-1,.3),scene);keylight.intensity=.85;
const glow=new B.GlowLayer('neonGlow',scene,{blurKernelSize:32});glow.intensity=.3;
const material=(name,hex,emit=0)=>{const m=new B.StandardMaterial(name,scene);m.diffuseColor=B.Color3.FromHexString(hex);m.emissiveColor=m.diffuseColor.scale(emit);m.specularColor=new B.Color3(.4,.46,.58);m.specularPower=70;return m};
const steel=material('steel','#434c60'),dark=material('blackSteel','#171d2b'),ground=material('floor','#202b3b'),rust=material('rust','#6a352a'),yellow=material('hazard','#efb238',.15),red=material('red','#ff3555',1),cyan=material('cyan','#12dbf3',1),purple=material('purple','#d64aff',1),white=material('white','#c9e5ed',.45);
const block=(name,w,h,d,x,y,z,m)=>{const mesh=B.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);mesh.position.set(x,y,z);mesh.material=m;return mesh};
block('warehouseBase',12,.4,12,0,-.5,0,dark);block('floorPlate',11.8,.08,11.8,0,-.26,0,ground);
for(let i=-5;i<=5;i++){block('floorLineX'+i,11.5,.008,.014,0,-.213,i,steel);block('floorLineZ'+i,.014,.008,11.5,i,-.213,0,steel)}
const at=i=>({x:(PATH[i][0]-3.5)*1.22,z:(PATH[i][1]-3.5)*1.22});
const kinds=['START','ACTION','SLF','EVENT','SPECIAL'];
const kind=i=>i===0?'START':i===63?'ZIEL':i%11===0?'SLF':i%7===0?'SPECIAL':i%3===0?'ACTION':'EVENT';
const tint=t=>t==='SLF'?cyan:t==='ACTION'?red:t==='SPECIAL'?yellow:t==='START'||t==='ZIEL'?white:purple;
const tiles=[];
for(let i=0;i<64;i++){
const p=at(i),t=kind(i),m=tint(t);
block('tileBase'+i,.94,.25,.94,p.x,-.035,p.z,dark);
block('tileRim'+i,.9,.06,.9,p.x,.13,p.z,m);
block('tileFace'+i,.79,.035,.79,p.x,.181,p.z,steel);
const dt=new B.DynamicTexture('tileNumber'+i,{width:256,height:256},scene,true),ctx=dt.getContext();
ctx.clearRect(0,0,256,256);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#ffffff';ctx.font='900 112px Arial';ctx.fillText(String(i+1),128,109);ctx.font='bold 26px Arial';ctx.fillStyle=t==='SLF'?'#44edff':t==='ACTION'?'#ff829a':'#f5d89e';ctx.fillText(t,128,199);dt.hasAlpha=true;dt.update();
const tm=new B.StandardMaterial('tileTextMaterial'+i,scene);tm.diffuseTexture=dt;tm.opacityTexture=dt;tm.emissiveColor=new B.Color3(1,1,1);tm.disableLighting=true;tm.backFaceCulling=false;
const plane=B.MeshBuilder.CreatePlane('tileLabel'+i,{size:.72},scene);plane.rotation.x=Math.PI/2;plane.position.set(p.x,.212,p.z);plane.material=tm;
tiles.push({p,t});
}
for(let i=0;i<64;i++){const p=at(i),q=at((i+1)%64),x=(p.x+q.x)/2,z=(p.z+q.z)/2;if(p.x!==q.x)block('connector'+i,.3,.04,.09,x,.10,z,i%2?cyan:red);else block('connector'+i,.09,.04,.3,x,.10,z,i%2?cyan:red)}
// All large props are deliberately outside the 64 tile footprints.
for(const x of [-5.35,5.35])for(const z of [-5.35,5.35]){block('pillar'+x+z,.26,2.6,.26,x,1.05,z,steel);block('pillarBand'+x+z,.3,.08,.3,x,.75,z,yellow)}
// Arena 0.3: radically different underground rave-club facade, not a warehouse panel wall.
const obsidian=material('charcoalConcrete','#141622'),brick=material('sootBrick','#302a38'),blackMetal=material('blackMetal','#10101a'),warmRust=material('weatheredCopper','#713c32'),hotPink=material('hotPink','#ff1269',1.5),electricBlue=material('electricBlue','#04d9ff',1.5),hotAmber=material('hotAmber','#ffb01e',1.0);
block('clubBackWall',11.6,5.6,.42,0,1.9,5.68,obsidian);
// Brick coursing adds physical relief, rather than smooth identical panels.
for(let row=0;row<18;row++)for(let col=0;col<17;col++){
 const x=-5.5+col*.69+(row%2)*.34,y=-.64+row*.265;
 if(x>5.55)continue;
 block('blackBrick'+row+'_'+col,.655,.225,.045,x,y,5.425,(row+col)%7===0?brick:obsidian);
}
// Gigantic angled structural braces and neon zigzag motifs.
for(const side of [-1,1]){
 const brace=block('diagonalGirder'+side,.27,5.1,.38,side*3.95,1.75,5.12,blackMetal);
 brace.rotation.z=side*.24;
 const strip=block('girderNeon'+side,.065,4.65,.07,side*3.95,1.8,4.88,side===1?hotPink:electricBlue);
 strip.rotation.z=side*.24;
 for(const y of [.2,1.5,2.8,4])block('girderCrossBolt'+side+y,.47,.1,.18,side*(3.95+(y-1.8)*.24),y,4.94,hotAmber);
}
// The central raised DJ stage and huge neon sign form the visual focal point.
block('djStageFoundation',5.5,.68,1.05,0,-.05,4.99,blackMetal);
block('djStageFrontLED',5.2,.16,.07,0,.27,4.41,hotPink);
block('djStageTop',5.5,.1,1.04,0,.33,4.99,brick);
block('djBooth',3.7,.85,.52,0,1.12,5.05,blackMetal);
block('djBoothPink',3.52,.13,.075,0,1.34,4.75,hotPink);
for(const x of [-1.28,-.68,.68,1.28]){
 const disc=B.MeshBuilder.CreateCylinder('deck'+x,{diameter:.42,height:.05,tessellation:24},scene);disc.position.set(x,1.59,4.93);disc.material=steel;
}
for(const x of [-4.85,4.85]){
 block('speakerTower'+x,.98,3.4,.68,x,1.3,4.83,blackMetal);
 for(const y of [.24,1.25,2.35]){
 const ring=B.MeshBuilder.CreateTorus('speakerConeRing'+x+y,{diameter:.69,thickness:.09,tessellation:24},scene);
 ring.position.set(x,y,4.46);ring.material=hotPink;
 const cone=B.MeshBuilder.CreateCylinder('speakerCone'+x+y,{diameter:.47,height:.055,tessellation:24},scene);
 cone.rotation.x=Math.PI/2;cone.position.set(x,y,4.415);cone.material=brick;
 }
 block('speakerTopLight'+x,.94,.09,.72,x,3.05,4.83,electricBlue);
}
// Neon sign, several times larger than the previous version.
const logoTex=new B.DynamicTexture('giantClubLogo',{width:1536,height:512},scene,true),lc=logoTex.getContext();
lc.clearRect(0,0,1536,512);lc.textAlign='center';lc.textBaseline='middle';lc.shadowColor='#ff005c';lc.shadowBlur=32;lc.fillStyle='#ff4d94';lc.font='900 168px Arial';lc.fillText('AAL YOU READY?',768,170);
lc.shadowColor='#05eaff';lc.shadowBlur=24;lc.fillStyle='#8af8ff';lc.font='900 66px Arial';lc.fillText('THE DOMINIK EXPERIENCE',768,315);lc.shadowBlur=0;logoTex.hasAlpha=true;logoTex.update();
const logoMat=new B.StandardMaterial('giantNeonSignMaterial',scene);logoMat.diffuseTexture=logoTex;logoMat.opacityTexture=logoTex;logoMat.emissiveColor=new B.Color3(1,1,1);logoMat.disableLighting=true;logoMat.backFaceCulling=false;
const logo=B.MeshBuilder.CreatePlane('giantNeonLogo',{width:6.2,height:2.07},scene);logo.position.set(0,3.15,5.06);logo.material=logoMat;
block('logoFrameTop',6.5,.08,.13,0,4.24,5.12,hotPink);
block('logoFrameBottom',6.5,.08,.13,0,2.04,5.12,electricBlue);
// Exposed industrial truss with suspended moving spotlights.
block('ceilingBeam',11.6,.27,.52,0,4.65,4.95,blackMetal);
for(const x of [-4,-2,0,2,4]){
 block('hangingLightMount'+x,.11,.56,.13,x,4.28,4.85,steel);
 const fixture=B.MeshBuilder.CreateCylinder('movingHead'+x,{diameterTop:.25,diameterBottom:.43,height:.45,tessellation:12},scene);
 fixture.position.set(x,3.89,4.82);fixture.material=blackMetal;
 const bulb=B.MeshBuilder.CreateSphere('movingHeadBulb'+x,{diameter:.18,segments:8},scene);
 bulb.position.set(x,3.66,4.82);bulb.material=x%4===0?hotPink:electricBlue;
 const spot=new B.SpotLight('clubSpot'+x,new B.Vector3(x,3.8,4.7),new B.Vector3(-x*.13,-1,-.45),Math.PI/3,3,scene);
 spot.diffuse=x%4===0?new B.Color3(1,.04,.32):new B.Color3(.04,.7,1);spot.intensity=2.2;spot.range=12;
}
// Open front and half-height sides: walls frame the arena without covering tiles.
for(const side of [-1,1]){
 const x=side*5.73;
 block('sideBlackParapet'+side,.24,.9,10.8,x,-.06,0,obsidian);
 for(const z of [-4.7,-2.35,0,2.35,4.7]){
  block('sidePillar'+side+z,.34,1.25,.34,x,.18,z,blackMetal);
  block('sidePillarLight'+side+z,.1,.82,.09,x-side*.19,.2,z,side===1?hotPink:electricBlue);
 }
 block('sideNeonGuard'+side,.09,.1,10.7,x,.78,0,side===1?hotPink:electricBlue);
}
// Smoke-haze and pool lighting; no opaque walls in front of the camera.
const leftWash=new B.PointLight('magentaWallWash',new B.Vector3(-4,3,4.5),scene);leftWash.diffuse=new B.Color3(1,.05,.4);leftWash.intensity=1.5;leftWash.range=9;
const rightWash=new B.PointLight('cyanWallWash',new B.Vector3(4,3,4.5),scene);rightWash.diffuse=new B.Color3(.03,.7,1);rightWash.intensity=1.5;rightWash.range=9;
const reactor=B.MeshBuilder.CreateCylinder('reactor',{height:1.45,diameter:.62,tessellation:16},scene);reactor.position.set(5.35,.48,0);reactor.material=dark;
const core=B.MeshBuilder.CreateCylinder('reactorCore',{height:1.08,diameter:.43,tessellation:16},scene);core.position.set(5.35,.52,0);core.material=red;
const warningLight=new B.PointLight('reactorLight',new B.Vector3(5.3,1.7,0),scene);warningLight.diffuse=new B.Color3(1,.08,.14);warningLight.intensity=.65;warningLight.range=5;
const marker=B.MeshBuilder.CreateSphere('routeTestMarker',{diameter:.35,segments:12},scene);marker.material=yellow;
let walking=false,started=0,view=0;
$('overview').onclick=()=>{camera.alpha=-Math.PI/2;camera.beta=.91;camera.radius=20;camera.target.set(0,0,0)};
$('angle').onclick=()=>{view=(view+1)%3;camera.beta=[.91,.48,1.1][view];camera.radius=[20,23,17][view]};
$('walk').onclick=()=>{walking=true;started=performance.now()};
$('stop').onclick=()=>{walking=false;marker.setEnabled(false)};
marker.setEnabled(false);
engine.runRenderLoop(()=>{if(walking){const step=((performance.now()-started)/450)%64,i=Math.floor(step),f=step-i,p=at(i),q=at((i+1)%64);marker.setEnabled(true);marker.position.set(p.x+(q.x-p.x)*f,.53,p.z+(q.z-p.z)*f)}scene.render()});
window.addEventListener('resize',()=>engine.resize());
status.textContent='64/64 eindeutige Felder · Rundkurs geschlossen · '+scene.meshes.length+' 3D-Meshes';
window.ARENA_DIAGNOSTICS.meshes=scene.meshes.length;window.ARENA_DIAGNOSTICS.ready=true;
}catch(e){error.style.display='block';error.textContent='3D-Fehler: '+e.message;console.error(e)}
}
window.addEventListener('load',boot);
</script></body></html>
